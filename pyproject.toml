[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-fine-tuning"
version = "0.1.0"
description = "Production-oriented RAG + Fine-tuning project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RAG Fine-Tuning Contributors" }]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
